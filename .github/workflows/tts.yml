name: SEORO TTS (ElevenLabs)
on:
  push:
    paths: ['_tts_jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Record
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/tts_gh.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "seoro-tts"
          git config user.email "seoro-tts@users.noreply.github.com"
          git add -A _tts_out _tts_jobs
          git diff --cached --quiet || git commit -m "TTS 결과 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
